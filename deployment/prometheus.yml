global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'github-mcp'
    static_configs:
      - targets: ['github-mcp:9001']

  - job_name: 'slack-mcp'
    static_configs:
      - targets: ['slack-mcp:9002']

  - job_name: 'database-mcp'
    static_configs:
      - targets: ['database-mcp:9003']

  - job_name: 'xomware-api-mcp'
    static_configs:
      - targets: ['xomware-api-mcp:9004']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
