apiVersion: v1
kind: Secret
metadata:
  name: mcp-secrets
  namespace: xom-mcp
type: Opaque
stringData:
  GITHUB_TOKEN: "${GITHUB_TOKEN}"
  SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN}"
  SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET}"
  DB_PASSWORD: "${DB_PASSWORD}"
  DB_USER: "xomware"
  XOMWARE_API_KEY: "${XOMWARE_API_KEY}"
  XOMWARE_AUTH_HASH: "${XOMWARE_AUTH_HASH}"
  JWT_SECRET: "${JWT_SECRET}"
  ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: xom-mcp
type: Opaque
stringData:
  POSTGRES_PASSWORD: "${DB_PASSWORD}"
  POSTGRES_USER: "xomware"
  POSTGRES_DB: "xomware"
