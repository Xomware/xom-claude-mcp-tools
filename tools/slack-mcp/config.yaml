server:
  name: slack-mcp
  version: 1.0.0
  description: "Slack MCP Server for messaging, notifications, and thread management"
  host: 0.0.0.0
  port: 8002

authentication:
  type: slack_bot_token
  token_source: environment  # SLACK_BOT_TOKEN env var
  scopes:
    - chat:write
    - conversations:read
    - search:read
    - reactions:write

tools:
  - name: send_message
    enabled: true
    description: "Send messages to Slack channels"
    
  - name: read_thread
    enabled: true
    description: "Read and search Slack threads"
    
  - name: send_notification
    enabled: true
    description: "Send notifications and alerts"

logging:
  level: INFO
  format: json
  file: logs/slack-mcp.log

monitoring:
  enabled: true
  prometheus_port: 9002
  health_check_path: /health

rate_limiting:
  enabled: true
  requests_per_minute: 60
  burst_size: 10
